# Every tag any item is allowed to use.
#
# Adding a tag here is the *only* step needed to make it appear in the filter
# bar on /work/. The build fails if an item uses a tag that is not listed, and
# also if a tag here is never used by anything, so this file cannot rot.
#
# There is deliberately only one group. The filter used to split tags into
# Contribution / Scope / Topic, but every tag outside that set either had one or
# two items behind it - a filter chip that narrow is noise, not navigation -
# or duplicated what the item itself already says. Open Source survived as the
# one genuinely useful extra tag, so it sits alongside the rest.
#
# Keep this list short. A tag that applies to almost everything (Machine
# Learning) or to almost nothing filters nothing out, and both are worse than
# not having it.

- id: computer-vision
  label: Computer Vision
- id: embodied-ai
  label: Embodied AI
- id: open-source
  label: Open Source
- id: reinforcement-learning
  label: Reinforcement Learning
- id: robotics
  label: Robotics
- id: paper
  label: Papers
- id: planning
  label: Planning
- id: representation-learning
  label: Representation Learning
- id: vision-language
  label: Vision & Language
- id: datasets
  label: Datasets & Benchmarks
- id: roles
  label: Roles
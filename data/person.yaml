# The one-line pitch under your name on the home page.
headline: >-
  I build perception systems that turn messy real-world imagery into usable 3D
  understanding - from 3D maps at Apple, to autonomous forklifts, to embodied
  agents that learn to see and act.

# Short paragraph: the top of the home page and the opening of /about/.
intro: >-
  I'm a machine learning researcher and engineer working on perception for
  robotics and mapping. Right now I'm at **Apple**, on the team that turns
  street-level imagery into detailed 3D maps. Before that I built the vision
  stack for autonomous forklifts at **Third Wave Automation**, and before that
  I did my Ph.D. in computer vision and machine learning at the **University
  of Washington**, working on reinforcement learning, embodied agents and
  representation learning.

# Long-form bio, only used on /about/. Write in Markdown. The list of roles
# below this is generated automatically from the `position` items in
# data/items/, so you never repeat a job description in two places.
about:
  - >-
    I currently work at **Apple** as a Senior Machine Learning Engineer on the
    Maps 3D Vision team. The work sits on the Detailed City Experience: taking
    high resolution street-level imagery and turning it into 3D road geometry,
    lane markings, crosswalks, bike lanes and painted areas, plus trees and
    buildings. Much of my time goes into segmentation, detection and diffusion
    models that have to run over imagery at world scale, and into end-to-end
    models that predict vectorised 3D maps straight from pixels.
  - >-
    Before that I spent four years at **Third Wave Automation** on autonomous
    forklifts. I led perception and pallet manipulation - detecting pallets and
    payloads, estimating their poses, scanning barcodes, and handling the
    forklift's internal state machine and its interface to the warehouse
    management system. It is a good reminder that production vision is mostly
    about the last few percent of awkward lighting, a bent pallet and a
    reflective wrapper.
  - >-
    My Ph.D. at the **University of Washington**, advised by Dieter Fox and Ali
    Farhadi, was about teaching machines to see and act in interactive visual
    environments. That covered visual semantic planning, hierarchical
    reinforcement learning, interactive question answering, and learning
    representations from unlabeled video. I was part of the
    [RAIVN Lab](https://raivn.cs.washington.edu/) and the
    [RSE Lab](https://rse-lab.cs.washington.edu/). I also spent research
    internships at **Facebook AI Research** and the **Allen Institute for AI**,
    and two summers building things for Google Maps.
  - >-
    A thread running through all of it is interest in
    **representation learning** - what makes features that generalize. Whether
    that is video as a source of natural augmentation, a factored perception
    and control model that transfers between simulators, or a recurrent tracker
    that updates itself online, the question is the same.


abstract: |
  I was head TA and organizer for the Introduction to Deep Learning course at
  the University of Washington in Fall 2019, teaching the basics of deep
  learning to more than 160 students.

  I wrote the homeworks, including an assignment in which students implement a
  neural network library using only Python, NumPy and Numba - no frameworks.
  We also used Colab notebooks and PyTorch to train real models on GPUs.

  I taught alongside Ali Farhadi, who ran the course, and nine other TAs. The
  lecture notes below are the ones I used; if you are an instructor and would
  like to reuse the solutions and tests, get in touch.


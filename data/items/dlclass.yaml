# The deep learning course I organized and head-taught at UW.
id: dlclass
type: course
title: "Introduction to Deep Learning"
summary: >
  I was head TA and organizer for the University of Washington's Introduction to Deep Learning course, including a from-scratch neural network library in NumPy.
org: "University of Washington"
role: "Head TA and Organizer"
date: 2019-09-01
end: 2019-12-01

venue: "CSE 490 / 599 G1"

tags:
  - computer-vision

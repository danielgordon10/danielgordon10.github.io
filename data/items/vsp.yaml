# Visual semantic planning - the paper that became my Ph.D. thesis topic.
# Daniel Gordon and Yuke Zhu share first authorship.
id: vsp
type: paper
title: "Visual Semantic Planning using Deep Successor Representations"
summary: >
  Visual semantic planning predicts action sequences that transform an environment, learned by bootstrapping RL with imitation over a successor representation model.
date: 2017-07-01

venue: "International Conference on Computer Vision"
venue_short: "ICCV 2017"

authors:
  - "Daniel Gordon*"
  - "Yuke Zhu*"
  - Eric Kolve
  - Dieter Fox
  - "Li Fei-Fei"
  - Abhinav Gupta
  - Roozbeh Mottaghi
  - Ali Farhadi

abstract: |
  A crucial capability of real-world intelligent agents is their ability to
  **plan** a sequence of actions to achieve their goals in the visual world. In
  this work, we address the problem of **visual semantic planning**: the task of
  predicting a sequence of actions from visual observations that transform a
  dynamic environment from an initial state to a goal state. Doing so entails
  knowledge about objects and their affordances, as well as actions and their
  preconditions and effects.

  We propose learning these through interacting with a visual and dynamic
  environment. Our proposed solution involves bootstrapping reinforcement
  learning with imitation learning. To ensure cross task generalization, we
  develop a deep predictive model based on successor representations. Our
  experimental results show near optimal results across a wide range of tasks in
  the challenging THOR environment.


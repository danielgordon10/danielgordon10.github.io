abstract: |
  I work on the **Detailed City Experience**, which upgrades the maps from a flat
  low-detail view to an immersive, highly detailed one. Using high resolution
  imagery we extract 3D road shape and features like lane markings, crosswalks
  and medians, and even painted color areas like bike lanes. Alongside that we
  build tree and building data for a rich 3D experience.

  My focus is the models that make this work at world scale: segmentation,
  detection and diffusion models run over street-level imagery, and end-to-end
  models that predict vectorised 3D maps straight from pixels.


# AI2-THOR, the simulator the embodied vision community works in.
id: ai2thor
type: dataset
title: "AI2-THOR: An Interactive 3D Environment for Visual AI"
summary: >
  AI2-THOR is a framework of procedurally generated synthetic 3D indoor scenes where 
  agents navigate and interact, spanning RL, planning, question answering and detection.
date: 2017-12-14

venue: "Allen Institute for Artificial Intelligence Technical Report"
venue_short: "AI2 TR 2017"


# ALFRED, the embodied instruction-following benchmark from the UW group.
id: alfred
type: paper
title: "ALFRED: A Benchmark for Interpreting Grounded Instructions for Everyday Tasks"
summary: >
  ALFRED maps natural-language instructions and egocentric vision to action sequences for household tasks, from 25k expert demonstrations in interactive environments.
date: 2019-12-01

venue: "Computer Vision and Pattern Recognition"
venue_short: "CVPR 2020"

authors:
  - Mohit Shridhar
  - Jesse Thomason
  - Daniel Gordon
  - Yonatan Bisk
  - Winson Han
  - Roozbeh Mottaghi
  - Luke Zettlemoyer
  - Dieter Fox

abstract: |
  We present ALFRED (**A**ction **L**earning **F**rom **R**ealistic
  **E**nvironments and **D**irectives), a benchmark for learning a mapping from
  natural language instructions and egocentric vision to sequences of actions
  for household tasks. Long composition rollouts with non-reversible state
  changes are among the phenomena we include to shrink the gap between research
  benchmarks and real-world applications.

  ALFRED consists of expert demonstrations in interactive visual environments
  for 25k natural language directives. These directives contain both high-level
  goals like "Rinse off a mug and place it in the coffee maker." and low-level
  language instructions like "Walk to the coffee maker on the right."

  ALFRED tasks are more complex in terms of sequence length, action space, and
  language than existing vision-and-language task datasets. We show that a
  baseline model designed for recent embodied vision-and-language tasks performs
  poorly on ALFRED, suggesting that there is significant room for developing
  innovative grounded visual language understanding models with this benchmark.


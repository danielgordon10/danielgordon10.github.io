# HIP-RL - merging symbolic planning with deep RL.
id: hiprl
type: paper
title: "What Should I Do Now? Marrying Reinforcement Learning and Symbolic Planning"
summary: >
  HIP-RL merges symbolic planning with deep reinforcement learning, reaching state-of-the-art results on three datasets with fewer test-time steps.
date: 2018-12-01

venue: "arXiv"
venue_short: "arXiv 2018"

authors:
  - Daniel Gordon
  - Dieter Fox
  - Ali Farhadi

abstract: |
  Long-term planning poses a major difficulty to many reinforcement learning
  algorithms. This problem becomes even more pronounced in dynamic visual
  environments. In this work we propose **Hierarchical Planning and
  Reinforcement Learning (HIP-RL)**, a method for merging the benefits and
  capabilities of Symbolic Planning with the learning abilities of Deep
  Reinforcement Learning.

  We apply HIP-RL to the complex visual tasks of interactive question answering
  and visual semantic planning and achieve state-of-the-art results on three
  challenging datasets all while taking fewer steps at test time and training in
  fewer iterations.


abstract: |
  An autonomous forklift - a self-driving material handling vehicle - navigates
  and operates without a human driver, using cameras, other sensors and
  software to load and unload goods in and out of racking.

  I led the **Perception and Pallet Manipulation** team, which covered everything
  from detecting pallets and payloads and estimating their poses, through
  barcode scanning, to the forklift's internal state machine and its interface
  with the warehouse management system. Over my four years the scope grew from
  individual perception contributions, to tech lead for the core perception
  product, to managing a team of five.

  The work mixed learned approaches with classical vision and robotics
  algorithms, and the goal was always the same: a best-in-class system that
  operates for real in difficult warehouses, at close to human reliability.


abstract: |
  I led the **Perception and Manipulation** team, which covered everything
  from detecting pallets and payloads and estimating their sizes, weights, and poses, 
  autonomously scanning barcodes, critical safety features, and even managing the 
  forklift's internal state machine and its interface with the warehouse management system.
  Over my four years the scope grew from individual perception contributions, to tech 
  lead for the core perception product, to managing a team of five engineers.

  The work mixed learned approaches with classical vision and robotics
  algorithms, and the goal was always the same: a best-in-class system that
  operates in production warehouses safely among other humans and forklifts, 
  all at human quality.


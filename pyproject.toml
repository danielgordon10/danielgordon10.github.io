[project]
name = "danielgordon-site"
version = "1.0.0"
description = "Static site generator for danielgordon10.github.io"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
site = "sitegen.__main__:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitegen"]

[tool.uv]
package = true
